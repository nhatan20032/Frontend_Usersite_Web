<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>RoutinePulse Mobile - Đăng Nhập Tài Khoản</title>
  <!-- Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
  <!-- Fonts: Roboto & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'g-bg': '#FFFFFF',
            'g-surface': '#F8F9FA',
            'g-border': '#DADCE0',
            'g-border-subtle': '#E8EAED',
            'g-text-primary': '#202124',
            'g-text-secondary': '#3C4043',
            'g-text-muted': '#5F6368',
            'g-blue': '#1A73E8',
            'g-blue-light': '#E8F0FE'
          },
          fontFamily: {
            sans: ['Roboto', 'Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    body { background-color: #F1F3F4; min-height: 100vh; }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined' !important;
      font-weight: normal !important;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-feature-settings: 'liga' 1;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .mobile-shell { width: 100%; max-width: 412px; height: 870px; margin: 0 auto; background: #FFFFFF; border-radius: 44px; box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.25), 0 0 0 12px #202124; position: relative; display: flex; flex-direction: column; justify-content: center; overflow: hidden; padding: 32px 24px; }
  </style>
</head>
<body class="text-g-text-primary flex justify-center p-0 sm:py-6 select-none">
<div class="mobile-shell shadow-2xl">

  <!-- Brand Logo -->
  <div class="w-14 h-14 rounded-2xl bg-g-blue text-white flex items-center justify-center font-bold text-2xl mb-6 shadow-md">
    <span class="material-symbols-outlined text-3xl font-bold">calendar_today</span>
  </div>

  <h1 class="text-2xl font-bold text-g-text-primary tracking-tight">RoutinePulse Mobile</h1>
  <p class="text-xs text-g-text-muted mt-1 mb-8">Không gian làm việc &amp; Kỷ luật hiệu suất cao</p>

  <!-- Login Form -->
  <form onsubmit="event.preventDefault(); alert('Đăng nhập thành công!');" class="space-y-4">
    <div>
      <label class="block text-xs text-g-text-secondary mb-1.5 font-medium">Email hoặc tên đăng nhập</label>
      <input type="email" value="nhatan.developer@gmail.com" class="w-full bg-white border border-g-border rounded-xl px-4 py-3 text-xs text-g-text-primary focus:outline-none focus:border-g-blue shadow-sm"/>
    </div>
    <div>
      <div class="flex items-center justify-between mb-1.5">
        <label class="block text-xs text-g-text-secondary font-medium">Mật khẩu</label>
        <a href="#" class="text-[11px] text-g-blue font-medium hover:underline">Quên mật khẩu?</a>
      </div>
      <input type="password" value="••••••••••••" class="w-full bg-white border border-g-border rounded-xl px-4 py-3 text-xs text-g-text-primary focus:outline-none focus:border-g-blue shadow-sm"/>
    </div>

    <button type="submit" class="w-full py-3.5 rounded-xl bg-g-blue hover:bg-blue-700 text-white font-medium text-xs shadow-md transition-all active:scale-95">
      Đăng nhập
    </button>
  </form>

  <div class="my-6 flex items-center gap-3 text-g-text-muted text-xs">
    <div class="flex-1 h-px bg-g-border"></div>
    <span>hoặc</span>
    <div class="flex-1 h-px bg-g-border"></div>
  </div>

  <!-- Single Sign-On Button -->
  <button onclick="alert('Đăng nhập Single Sign-On thành công!');" class="w-full py-3 rounded-xl bg-white border border-g-border hover:bg-g-surface text-g-text-primary font-medium text-xs flex items-center justify-center gap-2.5 shadow-sm transition-colors active:scale-95">
    <span class="material-symbols-outlined text-g-blue text-xl">vpn_key</span>
    <span>Đăng nhập Single Sign-On (SSO)</span>
  </button>

  <p class="text-center text-[11px] text-g-text-muted mt-8">
    Bằng việc tiếp tục, bạn đồng ý với Điều khoản dịch vụ và Chính sách bảo mật của RoutinePulse.
  </p>

</div>
</body>
</html>
