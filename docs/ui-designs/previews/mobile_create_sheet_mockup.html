<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>RoutinePulse - Tạo Sự Kiện Mới</title>
  <!-- Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
  <!-- Fonts: Roboto & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'g-bg': '#FFFFFF',
            'g-surface': '#F8F9FA',
            'g-border': '#DADCE0',
            'g-border-subtle': '#E8EAED',
            'g-text-primary': '#202124',
            'g-text-secondary': '#3C4043',
            'g-text-muted': '#5F6368',
            'g-blue': '#1A73E8',
            'g-blue-light': '#E8F0FE',
            'g-blue-container': '#C2E7FF'
          },
          fontFamily: {
            sans: ['Roboto', 'Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    body {
      min-height: 100vh;
      background-color: #F1F3F4;
    }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined' !important;
      font-weight: normal !important;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-feature-settings: 'liga' 1;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .mobile-shell {
      width: 100%;
      max-width: 412px;
      height: 870px;
      margin: 0 auto;
      background-color: #FFFFFF;
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.25), 0 0 0 12px #202124;
      border-radius: 44px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
  </style>
</head>
<body class="text-g-text-primary antialiased flex items-center justify-center min-h-screen p-0 sm:py-6 select-none">

<div class="mobile-shell relative flex flex-col bg-white">

  <!-- 0. Hardware Status Bar -->
  <div class="w-full h-8 shrink-0 flex items-center justify-between px-6 z-50 text-xs font-semibold text-g-text-primary bg-white select-none pt-1">
    <span class="font-mono text-[13px] font-bold">11:58</span>
    <div class="w-3.5 h-3.5 bg-black rounded-full"></div>
    <div class="flex items-center gap-1.5 text-g-text-secondary">
      <span class="material-symbols-outlined text-sm">signal_cellular_4_bar</span>
      <span class="material-symbols-outlined text-sm">wifi</span>
      <span class="material-symbols-outlined text-sm">battery_full</span>
    </div>
  </div>

  <!-- 1. Top Action Bar -->
  <header class="flex items-center justify-between px-4 py-2 border-b border-g-border-subtle shrink-0">
    <button onclick="history.back()" class="w-10 h-10 rounded-full flex items-center justify-center text-g-text-secondary hover:bg-g-surface transition-colors" title="Đóng">
      <span class="material-symbols-outlined text-2xl">close</span>
    </button>
    <button onclick="alert('Đã lưu sự kiện!')" class="bg-g-blue text-white text-xs font-semibold px-5 py-2 rounded-lg shadow-sm hover:bg-blue-700 active:scale-95 transition-all">
      Lưu
    </button>
  </header>

  <!-- 2. Clean Borderless Title Input -->
  <div class="px-6 pt-5 pb-2 shrink-0">
    <input type="text" placeholder="Thêm tiêu đề..." class="w-full bg-transparent border-0 text-2xl font-normal text-g-text-primary placeholder:text-g-text-muted focus:ring-0 focus:outline-none px-0"/>
  </div>

  <!-- 2.1 Category Pills -->
  <div class="px-6 py-2 shrink-0 flex items-center gap-2">
    <button class="px-3.5 py-1.5 rounded-full bg-g-blue-light text-g-blue text-xs font-semibold border border-g-blue/30">Sự kiện</button>
    <button class="px-3.5 py-1.5 rounded-full bg-g-surface text-g-text-secondary text-xs font-medium hover:bg-g-border-subtle">Việc làm</button>
    <button class="px-3.5 py-1.5 rounded-full bg-g-surface text-g-text-secondary text-xs font-medium hover:bg-g-border-subtle">Thói quen</button>
  </div>

  <!-- 3. Clean Flat Form List -->
  <form class="flex-1 px-6 py-3 space-y-5 overflow-y-auto no-scrollbar">

    <!-- Row 1: Category & Account -->
    <div class="flex items-center gap-5 text-sm pt-2">
      <span class="material-symbols-outlined text-g-text-muted text-2xl">event</span>
      <div class="flex-1">
        <span class="font-medium text-g-text-primary block text-sm">Lịch làm việc</span>
        <span class="text-g-text-muted text-xs">nhatan.developer@gmail.com</span>
      </div>
    </div>

    <!-- Row 2: All-Day Toggle -->
    <div class="space-y-3 pt-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-5">
          <span class="material-symbols-outlined text-g-text-muted text-2xl">schedule</span>
          <span class="text-g-text-primary font-medium text-sm">Cả ngày</span>
        </div>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" checked class="sr-only peer"/>
          <div class="w-11 h-6 bg-g-border peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-g-blue"></div>
        </label>
      </div>
      <div class="pl-11 text-sm font-medium text-g-text-primary">
        Thứ Hai, 19 Tháng 10, 2026
      </div>
    </div>

    <!-- Row 3: Repeats Weekly -->
    <div class="flex items-center gap-5 text-sm pt-2">
      <span class="material-symbols-outlined text-g-text-muted text-2xl">replay</span>
      <select class="flex-1 bg-transparent border-0 text-g-text-primary text-sm font-medium focus:ring-0 p-0 cursor-pointer">
        <option selected>Lặp lại hàng tuần vào Thứ Hai</option>
        <option>Không lặp lại</option>
        <option>Mỗi ngày làm việc (Thứ Hai đến Thứ Sáu)</option>
        <option>Hàng ngày</option>
      </select>
    </div>

    <div class="border-t border-g-border-subtle my-2"></div>

    <!-- Row 4: Video Conference Call -->
    <div class="flex items-center gap-5 text-sm">
      <span class="material-symbols-outlined text-g-blue text-2xl fill">videocam</span>
      <div class="flex-1">
        <span class="font-medium text-g-blue text-sm">Thêm phòng họp trực tuyến (Video Call)</span>
      </div>
    </div>

    <!-- Row 5: Location -->
    <div class="flex items-center gap-5 text-sm">
      <span class="material-symbols-outlined text-g-text-muted text-2xl">location_on</span>
      <input type="text" placeholder="Thêm vị trí..." class="flex-1 bg-transparent border-0 text-sm text-g-text-primary placeholder:text-g-text-muted focus:ring-0 p-0"/>
    </div>

    <!-- Row 6: Description -->
    <div class="flex items-center gap-5 text-sm">
      <span class="material-symbols-outlined text-g-text-muted text-2xl">subject</span>
      <input type="text" placeholder="Thêm mô tả..." class="flex-1 bg-transparent border-0 text-sm text-g-text-primary placeholder:text-g-text-muted focus:ring-0 p-0"/>
    </div>

    <!-- Row 7: Solid Color Picker -->
    <div class="flex items-center gap-5 text-sm pt-2">
      <span class="material-symbols-outlined text-g-text-muted text-2xl">palette</span>
      <div class="flex items-center gap-2">
        <button type="button" class="w-6 h-6 rounded-full bg-[#E67C73] ring-2 ring-offset-2 ring-g-blue"></button>
        <button type="button" class="w-6 h-6 rounded-full bg-[#1A73E8]"></button>
        <button type="button" class="w-6 h-6 rounded-full bg-[#0B8043]"></button>
        <button type="button" class="w-6 h-6 rounded-full bg-[#7986CB]"></button>
        <button type="button" class="w-6 h-6 rounded-full bg-[#F4511E]"></button>
      </div>
    </div>

  </form>

</div>

</body>
</html>
